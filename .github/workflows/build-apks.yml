name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Mini Calculator & Scientific Calculator APKs
        working-directory: android
        run: gradle :mini-calculator:assembleDebug :scientific-calculator:assembleDebug --no-daemon

      - name: Prepare named APK files
        run: |
          mkdir -p dist
          cp android/mini-calculator/build/outputs/apk/debug/mini-calculator-debug.apk dist/Mini-Calculator.apk
          cp android/scientific-calculator/build/outputs/apk/debug/scientific-calculator-debug.apk dist/Scientific-Calculator.apk
          ls -lh dist/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apks
          path: dist/*.apk

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Mini-Calculator.apk dist/Scientific-Calculator.apk --clobber
          else
            gh release create "$TAG" dist/Mini-Calculator.apk dist/Scientific-Calculator.apk \
              --title "Neon Glass Calculators $TAG" \
              --notes "### What's New in $TAG\n- Added live auto-calculation preview (shows \`= answer\` while typing before pressing \`=\`)\n- Added scientific-notation chaining support (e.g. \`1E12 + 5\`)\n\nDownload either **Mini-Calculator.apk** or **Scientific-Calculator.apk** below and install on your Android device." \
              --latest
          fi

