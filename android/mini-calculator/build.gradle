plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quinto.minicalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.quinto.minicalculator"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}

