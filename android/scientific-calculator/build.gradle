plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quinto.scientificcalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.quinto.scientificcalculator"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}

